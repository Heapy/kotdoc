org.gradle.caching=true
org.gradle.parallel=true
# Gradle builds an in-memory tree for both HTML and JUnit XML reports.
# The 2.56-million-test corpus exhausted 2 GiB in TestTreeModel.StoreLoader
# after every test worker finished. Workers retain their separate 2 GiB limit.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.code.style=official
