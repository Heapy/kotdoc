  windows-proxy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: .\gradlew.bat :core:test --tests "io.heapy.kotdoc.http.Http*Proxy*Test" --tests "io.heapy.kotdoc.http.HttpWindowsRegistry*Test" --tests "io.heapy.kotdoc.resources.GhcEnvironmentTest" --tests "io.heapy.kotdoc.resources.GhcEnvironmentLookupTest" --tests "io.heapy.kotdoc.resources.GhcEnvironmentLookupNativeTest" --tests "io.heapy.kotdoc.resources.GhcTextEncodingTest" --tests "io.heapy.kotdoc.resources.GhcEncodingGlobalsTest" --tests "io.heapy.kotdoc.resources.GhcCodePageTest" --tests "io.heapy.kotdoc.asn1.CertificateBinaryTest" --tests "io.heapy.kotdoc.asn1.Asn1TypesTest" --tests "io.heapy.kotdoc.asn1.Asn1ValuesTest" --tests "io.heapy.kotdoc.asn1.Asn1TypedTest" --tests "io.heapy.kotdoc.asn1.Asn1PrettyTest" --tests "io.heapy.kotdoc.x509.X509AlgorithmTest" --tests "io.heapy.kotdoc.x509.X509DistinguishedNameTest" --tests "io.heapy.kotdoc.time.*" --no-daemon "-Pkotlin.compiler.execution.strategy=in-process"
      - name: Verify Windows proxy results including actual registry execution
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as E
          expected = {"HttpProxyEnvironmentTest": 4462, "HttpWindowsProxyTest": 2180,
                      "HttpWindowsRegistryBindingTest": 2, "HttpWindowsRegistryNativeTest": 1,
                      "GhcEnvironmentTest": 3828, "GhcEnvironmentLookupTest": 8090,
                      "GhcEnvironmentLookupNativeTest": 1, "GhcTextEncodingTest": 968,
                      "GhcEncodingGlobalsTest": 2498, "GhcCodePageTest": 4864, "CertificateBinaryTest": 12331,
                      "Asn1TypesTest": 12251, "Asn1ValuesTest": 9756,
                      "HourglassLibraryTest": 10676, "HourglassNativeTest": 2, "HourglassFormatTest": 27639, "Asn1TypedTest": 38652, "Asn1PrettyTest": 20161, "X509AlgorithmTest": 44472, "X509DistinguishedNameTest": 28426}
          actual = {}
          for path in Path("core/build/test-results/test").glob("TEST-*.xml"):
              suite = E.parse(path).getroot()
              name = suite.attrib["name"].rsplit(".", 1)[1]
              cases = suite.findall("testcase")
              assert len(cases) == int(suite.attrib["tests"]), path
              assert all(int(suite.attrib[k]) == 0 for k in ("failures", "errors", "skipped")), path
              assert not suite.findall(".//failure") + suite.findall(".//error") + suite.findall(".//skipped"), path
              actual[name] = len(cases)
          assert actual == expected, actual
          print("Verified 231,260 Windows proxy/environment/encoding/ASN1/hourglass tests, including real Advapi32/HKCU, Kernel32 environment lookup/growth, CP932 conversion, lazy invalid code pages, initial encodings, PEM/raw-ASN1, ASN1 values, ParseASN1, controlled POSIX/Windows hourglass boundaries actual Kernel32 clocks/conversion/error mapping, hourglass format/parse callbacks/lazy results, typed BER/DER/Time/Real all five original generator/property replays, Pretty, encoded-event demand and X509 algorithm identifiers/original signature property, distinguished names/original DN generator/property and deferred parser errors; no skipped tests")
