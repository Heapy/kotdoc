name: Kotlin port tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tools/import-pandoc-json-fixtures.py --check
      - run: python3 tools/import-native-fixtures.py --check-source
      - run: python3 tools/import-fb2-fixtures.py --check-source
      - run: python3 tools/import-fb2-writer-fixtures.py --check-source
      - run: python3 tools/import-resource-tables.py --check
      - run: python3 tools/import-media-fixtures.py --check-source
      - run: python3 tools/import-media-operations.py --check-source
      - run: python3 tools/import-extension-tables.py --check
      - run: python3 tools/import-extension-fixtures.py --check-source
      - run: python3 tools/import-option-fixtures.py --check-source
      - run: python3 tools/import-toc-fixtures.py --check-source
      - run: python3 tools/import-emoji-tables.py --check
      - run: python3 tools/import-case-mappings.py --check
      - run: python3 tools/import-identifier-fixtures.py --check-source
      - run: python3 tools/import-html-entities.py --check
      - run: python3 tools/import-tagsoup-fixtures.py --check
      - run: python3 tools/import-html-id-fixtures.py --check-source
      - run: python3 tools/import-chunk-fixtures.py --check-source
      - run: python3 tools/import-slide-fixtures.py --check-source
      - run: python3 tools/import-image-header-fixtures.py --check-source
      - run: python3 tools/import-image-dimension-fixtures.py --check-source
      - run: python3 tools/import-gif-metadata-fixtures.py --check-source
      - run: python3 tools/import-tiff-metadata-fixtures.py --check-source
      - run: python3 tools/import-png-metadata-fixtures.py --check-source
      - run: python3 tools/import-image-bitstream-fixtures.py --check-source
      - run: python3 tools/import-jpeg-table-fixtures.py --check-source
      - run: python3 tools/import-jpeg-block-fixtures.py --check-source
      - run: python3 tools/import-jpeg-binary-fixtures.py --check-source
      - run: ./gradlew test :cli:installDist --no-daemon
      - run: python3 tools/check-fb2-cli.py
      - run: python3 tools/check-media-cli.py
      - run: python3 tools/check-extension-cli.py
      - run: python3 tools/check-math-cli.py
      - name: Exercise installed CLI
        run: |
          printf '%s\n' '{"pandoc-api-version":[1,23,1,2],"meta":{},"blocks":[]}' > /tmp/input.json
          cli/build/install/cli/bin/cli --from json --to json /tmp/input.json -o /tmp/output.json
          cmp /tmp/input.json /tmp/output.json
          printf '%s\n' 'Str "hello"' > /tmp/input.native
          cli/build/install/cli/bin/cli -f native -t json /tmp/input.native -o /tmp/from-native.json
          cli/build/install/cli/bin/cli -f json -t native /tmp/from-native.json -o /tmp/roundtrip.native
          printf '%s\n' '[ Plain [ Str "hello" ] ]' > /tmp/expected.native
          cmp /tmp/expected.native /tmp/roundtrip.native
          cli/build/install/cli/bin/cli -f fb2 -t native --standalone upstream/pandoc/test/fb2/reader/notes.fb2 -o /tmp/notes.native
          cmp upstream/pandoc/test/fb2/reader/notes.native /tmp/notes.native
          if cli/build/install/cli/bin/cli --from unknown /tmp/input.json; then
            echo 'Unsupported formats must fail'
            exit 1
          fi
